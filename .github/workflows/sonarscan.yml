name: SonarCloud Scan
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  SONAR_PROJECTKEY: 'myblueprint-spaces_papiermirror'
  SONAR_ORGANIZATION: 'myblueprint'

jobs:
  scan:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]'}}
    timeout-minutes: 20
    concurrency: 
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.base_ref || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      # Needed to run SonarQube scanner
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'microsoft'
          java-version: '17'
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./.sonar/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir ~/.sonar
          mkdir ~/.sonar/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ~/.sonar/scanner
      - name: Cache Coverage
        id: cache-coverage
        uses: runs-on/cache@88d90644011a3a9957fd141a106f5a94f9794203 # v5.0.7
        with:
          path: ~/.dotnet/coverage
          key: ${{ runner.os }}-coverage
          restore-keys: ${{ runner.os }}-coverage
      - name: Install Coverage tool
        if: steps.cache-coverage.outputs.cache-hit != 'true'
        run: |
          mkdir ~/.dotnet/coverage
          dotnet tool update dotnet-coverage --tool-path ~/.dotnet/coverage
      - name: Restore dependencies
        run: dotnet restore
        env: 
          NODE_AUTH_TOKEN: ${{secrets.NODE_AUTH_TOKEN}}
      - name: Build and scan
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          ~/.sonar/scanner/dotnet-sonarscanner begin /k:"${{ env.SONAR_PROJECTKEY }}" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="https://sonarcloud.io" /o:"${{ env.SONAR_ORGANIZATION }}" /d:sonar.cs.vscoveragexml.reportsPaths="coverage/**/coverage.xml"
          dotnet build --no-restore
          ~/.dotnet/coverage/dotnet-coverage collect --output coverage/coverage.xml --output-format xml dotnet test --no-build
          ~/.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOTNET_ROLL_FORWARD: Major
      - name: Build and scan for PR
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          ~/.sonar/scanner/dotnet-sonarscanner begin /k:"${{ env.SONAR_PROJECTKEY }}" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="https://sonarcloud.io" /o:"${{ env.SONAR_ORGANIZATION }}" /d:sonar.pullrequest.key="${{ github.event.number }}" /d:sonar.pullrequest.branch="${{ github.event.pull_request.head.ref }}" /d:sonar.pullrequest.base="${{ github.event.pull_request.base.ref }}" /d:sonar.pullrequest.github.repository="${{ github.event.repository.name }}" /d:sonar.pullrequest.provider="github" /d:sonar.cs.vscoveragexml.reportsPaths="coverage/**/coverage.xml"
          dotnet build --no-restore
          ~/.dotnet/coverage/dotnet-coverage collect --output coverage/coverage.xml --output-format xml dotnet test --no-build
          ~/.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOTNET_ROLL_FORWARD: Major
