version: 2

updates:
  # Enable version updates for nuget
  - package-ecosystem: "nuget"
    directory: "/"
    # Check the npm registry for updates every day (weekdays)
    schedule:
      interval: "daily"
      time: "10:00"
      timezone: "America/Toronto"
    target-branch: 'main'

  # Keep the SHA-pinned GitHub Actions current (updates the SHA and the version comment)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "America/Toronto"
    target-branch: 'main'
    groups:
      github-actions:
        patterns:
          - "*"
